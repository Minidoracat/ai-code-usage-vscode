name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full release gate without publishing."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm_publish:
        description: "Type true to publish during manual dispatch. Ignored when dry_run is true."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: marketplace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        run: npm run check:release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Run release gate
        run: npm run release:gate

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-usage-vsix
          path: ai-code-usage-*.vsix
          if-no-files-found: error
          retention-days: 30

  dry-run:
    name: Dry run result
    runs-on: ubuntu-latest
    needs: release-gate
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'

    steps:
      - name: Confirm dry run
        run: echo "Release gate passed. Dry run completed without reading VSCE_PAT or publishing."

  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest
    needs: release-gate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' && inputs.confirm_publish == 'true')
    environment: marketplace-production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check:release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Require Marketplace token
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required in the marketplace-production environment."
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
