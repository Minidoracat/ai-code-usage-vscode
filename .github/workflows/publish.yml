name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full release gate without publishing."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm_publish:
        description: "Type true to publish during manual dispatch. Ignored when dry_run is true."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: marketplace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check i18n
        run: npm run check:i18n

      - name: Check privacy
        run: npm run check:privacy

      - name: Check pricing
        run: npm run check:pricing

      - name: Check test data
        run: npm run check:test-data

      - name: Package VSIX
        run: npm run package:vsix

      - name: Inspect VSIX
        run: npm run inspect:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-usage-vsix
          path: "*.vsix"
          if-no-files-found: error

  dry-run:
    name: Dry run result
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'

    steps:
      - name: Confirm dry run
        run: echo "Release gate passed. Dry run completed without reading VSCE_PAT or publishing."

  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' && inputs.confirm_publish == 'true')
    environment: marketplace-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight version
        run: node -e "const p=require('./package.json'); if (!/^\\d+\\.\\d+\\.\\d+$/.test(p.version)) throw new Error('package.json version must be SemVer'); console.log('Publishing version', p.version);"

      - name: Require Marketplace token
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required in the marketplace-production environment."
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
